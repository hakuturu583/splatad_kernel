[project]
name = "splatad-kernel"
version = "1.0.1"
description = "SplatAD's spherical LiDAR rasterizer as a standalone package"
readme = "README.md"
authors = [{ name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    # The CUDA extension is built by torch.utils.cpp_extension at import time,
    # so torch is a runtime dependency, not just a build-time one. No version is
    # pinned here: the consumer picks the torch (and therefore the CUDA) it
    # wants, and the extension compiles against whatever is installed. A
    # consumer that pins torch should pin it in ITS OWN resolution, the way
    # splatsim does with a build-constraint on the CUDA 12.x series.
    "torch",
    # The JIT build reports progress through rich, and the wrappers annotate
    # with typing_extensions.Literal. Both usually arrive with torch, but this
    # package imports them directly.
    "rich",
    "typing_extensions",
    # ninja drives the JIT compile.
    "ninja",
    # The kernel compiles against gsplat's CUDA headers rather than vendoring
    # its own copies: the shared device math (Utils.cuh, Common.h) and the glm
    # headers both ship inside the gsplat package. Only SplatAD's own spherical
    # LiDAR math is kept here. No version pin: the consumer chooses the gsplat
    # it wants, and it needs one anyway for the camera path. Known good against
    # gsplat 1.5.3.
    "gsplat",
]

[project.urls]
Homepage = "https://github.com/hakuturu583/splatad_kernel"
Upstream = "https://github.com/carlinds/splatad"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The CUDA sources must ship with the package: the extension is compiled from
# them on the machine that imports it. The glm and gsplat headers do not -- they
# are read out of the installed gsplat (see cuda/_backend.gsplat_include_paths).
[tool.setuptools.package-data]
splatad_kernel = [
    "cuda/csrc/*.cu",
    "cuda/csrc/*.cuh",
    "cuda/csrc/*.cpp",
    "cuda/csrc/*.h",
]

[tool.ruff]
# Kept close to upstream so diffs against SplatAD stay readable.
exclude = ["src/splatad_kernel/cuda/csrc"]
